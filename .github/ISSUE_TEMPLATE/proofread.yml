name: Proofread a prediction
description: Ask for an automatic segmentation to be proofread (Paintera) in one or more boxes
title: "<dataset>_<crop>_manual_gt-<class>-final"
body:
  - type: markdown
    attributes:
      value: |
        **How this form works**
        1. Fill the fields below. The ones marked required must be filled before you can submit. The grey text in a box shows the exact format to use.
        2. Submit. The automation reads your answers as written, so please keep the formats (for example `Z[start:end], Y[start:end], X[start:end]`).
        3. Then use comments as before: ask for the Paintera files, and when the work is done the annotator replies `Exported to <folder path>` and says `final` or `snapshot`.
        Questions about a field: ask in the comments or tag @dchen116.
        The title becomes the name of the final label: `<dataset>_<crop>_manual_gt-<class>-final` (for example `exm-drosophila-flyliconn-FlyID49-2ndgel-DUP-BIS-40XW005-20260625_crop-001_manual_gt-neuron-final`).

  - type: dropdown
    id: kind
    attributes:
      label: Kind of work
      options:
        - Proofread a prediction
        - Proofread and sparsely trace full neurons from a prediction
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What and why
      description: One or two sentences, and who made the prediction.
      placeholder: "We would like to proofread the automatic LSD-based predictions on the FlyLICONN FlyID49_40XW005 volume. Predictions were generated by @CarlaRodriguez96."
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Image Data (Fileglancer link to the raw image that pairs with the prediction label to be proofread)
      placeholder: "https://fileglancer.int.janelia.org/browse/groups_miaai_miaai/lmd-v0.0.1/data/<dataset>/crop-001.zarr/raw"
    validations:
      required: true
  - type: input
    id: prediction
    attributes:
      label: Predictions (Fileglancer link to the segmentation to proofread)
      placeholder: "https://fileglancer.int.janelia.org/browse/groups_miaai_miaai/lsd_segmentations/<name>.zarr/<segmentation>"
    validations:
      required: true
  - type: textarea
    id: bboxes
    attributes:
      label: Proposed proofread BBoxes
      description: One box per line, `Z[start:end], Y[start:end], X[start:end]` in voxels. Write the grid the numbers are in on the first line.
      value: |
        Resolution is segmentation layer (9 nm iso)
        BBox 1: Z[start:end], Y[start:end], X[start:end]
    validations:
      required: true
  - type: textarea
    id: neurons
    attributes:
      label: Neurons to trace (optional)
      description: One per line, the segment id and a point inside it, in the same grid as the boxes.
      placeholder: "ID: 218072156, coordinates ZYX: [276, 743, 698]"
  - type: input
    id: previous
    attributes:
      label: Done previously
      placeholder: "manual_gt-cell-final, or none"
  - type: input
    id: annotators
    attributes:
      label: Hand to (GitHub users)
      placeholder: "@walshjj @takemurasa"
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        1) Proofread every voxel inside the bbox. Voxels outside the bbox do not need to be proofread.
  - type: markdown
    attributes:
      value: |
        **Next:** ask for the Paintera files in a comment ("could you please provide @user with the Paintera formatted labels for the BBoxes?"). When the work is done, the annotator replies with `Exported to <folder path>` and says `final` or `snapshot`.
