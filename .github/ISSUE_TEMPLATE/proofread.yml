name: Proofread a prediction
description: Ask for an automatic segmentation to be proofread (Paintera) in one or more boxes
title: <dataset>_<crop>_manual_gt-<class>-final
body:
- type: markdown
  attributes:
    value: |
      **How this form works**
      1. Go through the steps below in order (Step 1, Step 2, ...). A step marked (optional) can be left empty; the others must be filled before you can submit. The grey text in a box shows the exact format to use.
      2. Submit. The automation reads your answers as written, so please keep the formats (for example `Z[start:end], Y[start:end], X[start:end]`).
      3. Then use comments as before: ask for the Paintera files, and when the work is done the annotator replies `Exported to <folder path>` and says `final` or `snapshot`.
      Questions about a field: ask in the comments or tag @dchen116.
      The title becomes the name of the final label: `<dataset>_<crop>_manual_gt-<class>-final` (for example `exm-drosophila-flyliconn-FlyID49-2ndgel-DUP-BIS-40XW005-20260625_crop-001_manual_gt-neuron-final`).
- type: dropdown
  id: kind
  attributes:
    label: Step 1. Kind of work
    options:
    - Proofread a prediction
    - Proofread and sparsely trace full neurons from a prediction
  validations:
    required: true
- type: textarea
  id: request
  attributes:
    label: Step 2. What and why
    description: One or two sentences, and who made the prediction.
    placeholder: We would like to proofread the automatic LSD-based predictions on the FlyLICONN FlyID49_40XW005 volume. Predictions were generated by @CarlaRodriguez96.
  validations:
    required: true
- type: input
  id: image
  attributes:
    label: Step 3. Image Data (Fileglancer link to the raw image that pairs with the prediction label to be proofread)
    placeholder: https://fileglancer.int.janelia.org/browse/groups_miaai_miaai/lmd-v0.0.1/data/<dataset>/crop-001.zarr/raw
  validations:
    required: true
- type: input
  id: prediction
  attributes:
    label: Step 4. Predictions (Fileglancer link to the segmentation to proofread)
    placeholder: https://fileglancer.int.janelia.org/browse/groups_miaai_miaai/lsd_segmentations/<name>.zarr/<segmentation>
  validations:
    required: true
- type: input
  id: bbox1
  attributes:
    label: Step 5. BBox 1 (voxels)
    description: One box. Either start to end, `Z[265:532], Y[678:946], X[572:841]` (the end is not included), or start and size, `Z=265, Y=678, X=572, size 267x268x269` (the size in the same axis order as the start). Give the next box in the next step;
      leave unused ones empty.
    placeholder: Z[265:532], Y[678:946], X[572:841]  (or Z=265, Y=678, X=572, size 267x268x269)
  validations:
    required: true
- type: input
  id: bbox2
  attributes:
    label: Step 6. BBox 2 (voxels, optional)
- type: input
  id: bbox3
  attributes:
    label: Step 7. BBox 3 (voxels, optional)
- type: input
  id: bbox4
  attributes:
    label: Step 8. BBox 4 (voxels, optional)
- type: input
  id: bbox5
  attributes:
    label: Step 9. BBox 5 (voxels, optional)
- type: textarea
  id: bbox_more
  attributes:
    label: Step 10. More BBoxes (optional)
    description: Boxes 6 to 10, one box per line, in either format.
- type: input
  id: bbox_grid
  attributes:
    label: Step 11. Grid the BBox numbers are in (resolution)
    description: 'Which voxel grid the numbers count in: the segmentation layer, or the raw image.'
    placeholder: segmentation layer (9 nm iso)
  validations:
    required: true
- type: dropdown
  id: ng_view
  attributes:
    label: Step 12. Neuroglancer view of the boxes
    description: A view shows the boxes drawn over the raw image, so everyone sees the same regions.
    options:
    - Yes, post one view with all the boxes
    - No view needed
    - I will paste my own link (in the next step)
    default: 0
  validations:
    required: true
- type: input
  id: ng_link
  attributes:
    label: Step 13. Your Neuroglancer link (optional, only for the third choice above)
    description: The link of your own view. It stays as written; I only say something if the boxes drawn in it differ from the boxes above.
    placeholder: https://fileglancer.int.janelia.org/neuroglancer/#!...
- type: textarea
  id: neurons
  attributes:
    label: Step 14. Neurons to trace (optional)
    description: One per line, the segment id and a point inside it, in the same grid as the boxes.
    placeholder: 'ID: 218072156, coordinates ZYX: [276, 743, 698]'
- type: input
  id: previous
  attributes:
    label: Step 15. Done previously (optional)
    placeholder: manual_gt-cell-final, or none
- type: input
  id: annotators
  attributes:
    label: Step 16. Hand to (GitHub users)
    placeholder: '@walshjj @takemurasa'
  validations:
    required: true
- type: textarea
  id: tasks
  attributes:
    label: Step 17. Tasks (optional)
    value: |
      1) Proofread every voxel inside the bbox. Voxels outside the bbox do not need to be proofread.
- type: markdown
  attributes:
    value: |
      **Next:** ask for the Paintera files in a comment ("could you please provide @user with the Paintera formatted labels for the BBoxes?"). When the work is done, the annotator replies with `Exported to <folder path>` and says `final` or `snapshot`.
