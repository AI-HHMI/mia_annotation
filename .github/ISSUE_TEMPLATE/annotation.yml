name: Annotate a crop
description: Ask for a crop of a volume to be annotated by hand
title: <dataset>_<crop>
body:
- type: markdown
  attributes:
    value: |
      **How this form works**
      1. Go through the steps below in order (Step 1, Step 2, ...). A step marked (optional) can be left empty; the others must be filled before you can submit. The grey text in a box shows the exact format to use.
      2. Submit. The automation reads your answers as written, so please keep the formats (for example `Z[start:end], Y[start:end], X[start:end]`).
      3. Then the automation answers with a Neuroglancer link of the box. When the annotation is done, the annotator replies `Exported to <folder path>` and says `final` or `snapshot`.
      Questions about a field: ask in the comments or tag @dchen116.
- type: dropdown
  id: kind
  attributes:
    label: Step 1. Kind of work
    options:
    - Annotate a crop (manual annotation)
  validations:
    required: true
- type: input
  id: source
  attributes:
    label: Step 2. Source (Fileglancer link or cluster path to the raw image)
    placeholder: https://fileglancer.int.janelia.org/browse/groups_miaai_miaai/lmd-v0.0.1/data/<dataset>/crop-001_fullvol.zarr/raw
  validations:
    required: true
- type: dropdown
  id: organism
  attributes:
    label: Step 3. Organism
    options:
    - Drosophila
    - Mouse
    - Zebrafish
    - Human
    - Other (say which in the notes)
  validations:
    required: true
- type: input
  id: expansion
  attributes:
    label: Step 4. Expansion factor
    placeholder: none, or for example 16x
  validations:
    required: true
- type: input
  id: bbox1
  attributes:
    label: Step 5. BBox 1 (voxels of the raw image)
    description: One box. Either start to end, `Z[265:532], Y[678:946], X[572:841]` (the end is not included), or start and size, `Z=265, Y=678, X=572, size 267x268x269` (the size in the same axis order as the start). Give a second box in the next step;
      any more go in the text box after it.
    placeholder: X=1000, Y=1000, Z=807, size 482x482x194 (or Z[807:1001], Y[1000:1482], X[1000:1482])
  validations:
    required: true
- type: input
  id: bbox2
  attributes:
    label: Step 6. BBox 2 (voxels of the raw image, optional)
- type: textarea
  id: bbox_more
  attributes:
    label: Step 7. More BBoxes (BBox 3 and up, optional)
    description: Boxes 3 to 10, one box per line, in either format.
- type: dropdown
  id: ng_view
  attributes:
    label: Step 8. Neuroglancer view of the boxes
    description: The boxes drawn over the raw image, so everyone sees the same regions. The reply on the issue is how the boxes get approved.
    options:
    - Yes, post one view with all the boxes
    - No view needed (the boxes are listed on the issue)
    - I will paste my own link (in the next step)
    default: 0
  validations:
    required: true
- type: input
  id: ng_link
  attributes:
    label: Step 9. Your Neuroglancer link (optional, only for the third choice above)
    description: The link of your own view. It is shown in the reply instead of a new one; I only add a note if the boxes drawn in it differ from the boxes above.
    placeholder: https://fileglancer.int.janelia.org/neuroglancer/#!...
- type: input
  id: annotators
  attributes:
    label: Step 10. Hand to (GitHub users)
    placeholder: '@moric7 @trant16'
  validations:
    required: true
- type: textarea
  id: notes
  attributes:
    label: Step 11. Notes (optional)
    description: Anything about the data (how it was made, what to look for).
- type: markdown
  attributes:
    value: |
      **Next:** the automation answers with a Neuroglancer link for the box. When the work is done, the annotator replies with `Exported to <folder path>` and says `final` or `snapshot`.
