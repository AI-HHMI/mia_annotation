name: Add a box to an existing dataset
description: Ask for a new box (crop) of a dataset that is already in the data collection
title: "<dataset>_<crop>"
body:
  - type: markdown
    attributes:
      value: |
        **How this form works**
        1. Fill the fields below. The ones marked required must be filled before you can submit. The grey text in a box shows the exact format to use.
        2. Submit. The automation reads your answers as written, so please keep the formats (for example `Z[start:end], Y[start:end], X[start:end]`).
        3. Then the automation answers with a Neuroglancer link of the box on the raw image; reply there if the box needs to change.
        Questions about a field: ask in the comments or tag @dchen116.
  - type: input
    id: dataset
    attributes:
      label: Dataset issue (link or number, for example mia_pretraining#479)
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source (Fileglancer link or cluster path to the raw image)
      description: Leave empty when the dataset issue already holds it.
  - type: textarea
    id: bbox
    attributes:
      label: Bbox
      description: The corner and size in voxels of the raw image, or `Z[a:b], Y[a:b], X[a:b]` and the grid they are in.
      placeholder: "Bbox: topLeft X=1000, Y=1000, Z=807 - size 482x482x194 vox"
    validations:
      required: true
  - type: dropdown
    id: purpose
    attributes:
      label: What for
      options:
        - Annotation
        - Proofreading
        - Pretraining
    validations:
      required: true
  - type: input
    id: annotators
    attributes:
      label: Hand to (GitHub users)
      placeholder: "@moric7"
